name: Compile sources (no ROM)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'tools/compile_sources.py'
      - '.github/workflows/compile-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile all A2DE game and library sources
        run: python3 tools/compile_sources.py --prepare
      - name: Package public source snapshot
        if: always()
        run: git archive --format=tar.gz HEAD -o build/ci-objects/source-snapshot.tar.gz
      - name: Upload compiled objects and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A2DE-source-objects
          path: build/ci-objects/
          if-no-files-found: error
          retention-days: 7
